services:
  web:
    build: ./web
    environment:
      GREETING: ${GREETING:-hello from compose}
      REDIS_HOST: redis
    ports:
      - 3000
    deploy:
      resources:
        reservations:
          cpus: 0.25
          memory: 256M
  redis:
    image: redis:7-alpine
    expose:
      - 6379
    volumes:
      - cache:/data
    deploy:
      resources:
        reservations:
          cpus: 0.1
          memory: 128M
volumes:
  cache:
    driver_opts:
      size: 1Gi
